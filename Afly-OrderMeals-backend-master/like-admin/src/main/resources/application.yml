# 项目配置
like:
#  upload-directory: /www/uploads/
  upload-directory: D:\www\uploads\
  admin-notify-url: http://localhost:8082/api/internal/notify
  app-mock-login: true
  app-mock-login-mobile: "13800138000"

  captcha:
    # 是否开启验证码
    status: false
    # 验证码有效时长
    expire: 120
    # 验证码缓存键名
    token: "captcha:key:"

# 服务配置
server:
  port: 8082
  servlet:
    context-path: /

# 框架配置
spring:
  profiles:
    active: dev
  mvc:
    static-path-pattern: /api/static/**
    throw-exception-if-no-handler-found: true
  # 多数据源配置
  datasource:
    dynamic:
      primary: master
      strict: false
      hikari:
        connection-timeout: 30000
        minimum-idle: 5
        maximum-pool-size: 20
        auto-commit: true
        idle-timeout: 60000
        max-lifetime: 1800000
        connection-init-sql: SELECT 1
      datasource:
        master:
          url: jdbc:mysql://localhost:3306/like_admin?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2B8&allowMultiQueries=true
          username: like_admin
          password: thd3DYmypyNBFbyP
          driver-class-name: com.mysql.cj.jdbc.Driver
        ruoyi:
          url: jdbc:mysql://146.56.199.215:3306/ruoyi?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8&allowMultiQueries=true
          username: ruoyi
          password: 78PNMNHccWkbtLwr
          driver-class-name: com.mysql.cj.jdbc.Driver
  # 限制配置
  servlet:
    multipart:
      max-file-size: 100MB    # 文件上传大小限制
      max-request-size: 100MB # 文件最大请求限制
      enabled: true
  # Redis配置
  redis:
    host: localhost   # Redis服务地址
    port: 6379        # Redis端口
#    password: admin   # Redis密码
    database: 1       # 数据库索引
    timeout: 10000    # 连接超时
    lettuce:
      pool:
        max-wait: 30000 # 连接池最大阻塞等待时间(使用负数表示没有限制,默认-1)
        max-active: 100 # 连接池最大连接数(使用负数表示没有限制,默认8)
        max-idle: 20    # 连接池中的最大空闲连接(默认8)
        min-idle: 0     # 连接池中的最小空闲连接(默认0)

# Mybatis-plus配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**Mapper.xml
  typeAliasesPackage: com.mdd.**.mapper
  global-config:
    banner: false
    db-config:
      table-prefix: la_
  configuration-properties:
    prefix: la_

# Sa-token配置
sa-token:
  token-name: like-admin  # token的名称
  timeout: 2592000        # token有效期单位s(默认30天,-1代表永不过期)
  activity-timeout: -1    # token临时有效期(指定时间无操作掉线)
  is-concurrent: true     # 是否允许同一账号并发登录
  is-share: false         # 多人同登账号共用token
  token-style: random-64  # token生成的风格
  is-print: false         # 打印版本字符画
  is-log: false           # 是否输出操作日志